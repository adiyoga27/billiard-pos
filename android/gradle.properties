# Heap kecil per-JVM + worker dibatasi: heap 8G dipakai banyak proses paralel
# (daemon + R8/D8 + lint) bikin commit memory Windows habis → OOM saat build release.
org.gradle.jvmargs=-Xmx2G -XX:MaxMetaspaceSize=1G -XX:+HeapDumpOnOutOfMemoryError
org.gradle.workers.max=1
org.gradle.parallel=false
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
kotlin.incremental=false
